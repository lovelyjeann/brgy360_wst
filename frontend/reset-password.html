<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Brgy360</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            color: #15803d;
            border-radius: 50%;
            font-size: 25px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #15803d;
            box-shadow: 0 0 0 3px rgba(21,128,61,0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #15803d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .feedback.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #15803d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .invalid-state {
            text-align: center;
            color: #b91c1c;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <main class="reset-card">

        <div class="reset-header">
            <div class="reset-icon">🔒</div>
            <h1>Reset Your Password</h1>
            <p class="subtitle">
                Create a new password for your Brgy360 account.
            </p>
        </div>

        <div id="pageFeedback" class="feedback"></div>

        <form id="resetPasswordForm" class="hidden">

            <div class="field">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    minlength="8"
                    required
                    autocomplete="new-password">
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    minlength="8"
                    required
                    autocomplete="new-password">
            </div>

            <button type="submit" id="resetPasswordButton">
                Reset Password
            </button>

        </form>

        <div id="invalidTokenMessage" class="invalid-state hidden">
            Your password reset link is invalid, expired, or has already
            been used. Please request a new password reset link.
        </div>

        <a href="index.html" class="back-link">
            Back to Brgy360 Login
        </a>

    </main>

    <script>
        const API_BASE = 'http://localhost:5000/api/auth';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const resetPasswordForm =
            document.getElementById('resetPasswordForm');

        const pageFeedback =
            document.getElementById('pageFeedback');

        const invalidTokenMessage =
            document.getElementById('invalidTokenMessage');

        const resetPasswordButton =
            document.getElementById('resetPasswordButton');

        function showFeedback(message, type) {
            pageFeedback.textContent = message;
            pageFeedback.className = `feedback ${type}`;
        }

        async function verifyToken() {
            if (!token) {
                invalidTokenMessage.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(
                    `${API_BASE}/verify-reset-token/${encodeURIComponent(token)}`
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    invalidTokenMessage.classList.remove('hidden');
                    return;
                }

                resetPasswordForm.classList.remove('hidden');

            } catch (error) {
                console.error('Token verification failed:', error);
                showFeedback(
                    'Unable to connect to the server. Please try again.',
                    'error'
                );
            }
        }

        resetPasswordForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const password =
                document.getElementById('newPassword').value;

            const confirmPassword =
                document.getElementById('confirmPassword').value;

            if (password.length < 8) {
                showFeedback(
                    'Your password must contain at least 8 characters.',
                    'error'
                );
                return;
            }

            if (password !== confirmPassword) {
                showFeedback(
                    'The passwords do not match.',
                    'error'
                );
                return;
            }

            resetPasswordButton.disabled = true;
            resetPasswordButton.textContent = 'Resetting...';

            try {
                const response = await fetch(
                    `${API_BASE}/reset-password`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            token,
                            password,
                            confirmPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || 'Unable to reset your password.'
                    );
                }

                resetPasswordForm.reset();
                resetPasswordForm.classList.add('hidden');

                showFeedback(
                    'Your password has been reset successfully. You can now log in using your new password.',
                    'success'
                );

            } catch (error) {
                showFeedback(error.message, 'error');

            } finally {
                resetPasswordButton.disabled = false;
                resetPasswordButton.textContent = 'Reset Password';
            }
        });

        verifyToken();
    </script>

</body>
</html>
